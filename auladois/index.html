<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <form action="/register" method="post">

    <input type="text" placeholder="Informe seu nome" name="name"  id="name" required>   

    <input type="email" placeholder="Informe seu email" name="email" id="email" required>
    
    <input type="password" placeholder= "Informe sua senha" name="senha" id="senha">

    <input type="submit" value="Enviar">    
    
    </form>
</body>
</html>
